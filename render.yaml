databases:
  - name: ascendia-db
    plan: free

services:
  - type: web
    name: ascendia-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ascendia-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: COLLEGE_EMAIL_DOMAINS
        value: college.edu
      - key: PYTHON_VERSION
        value: "3.12.8"
